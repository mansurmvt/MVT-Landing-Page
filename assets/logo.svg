<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Radiant Electric Blue Gradients -->
    <linearGradient id="mvtPrimaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052fe" />
      <stop offset="45%" stop-color="#0084ff" />
      <stop offset="85%" stop-color="#00d8ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <linearGradient id="mvtDeepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="mvtArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <filter id="mvtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="mvtSubtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbit Arc -->
  <path d="M 320 85 C 290 65 240 55 190 65 C 105 85 45 160 45 250 C 45 345 115 425 210 440 C 265 448 320 430 360 395" 
        stroke="url(#mvtPrimaryGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#mvtSubtleGlow)"/>

  <!-- Stylized Monotonic 'M' Structure -->
  <path d="M 115 165 L 115 340 L 155 340 L 155 240 L 225 315 L 295 240 L 295 270 L 335 240 L 335 165 L 295 165 L 225 240 L 155 165 Z" 
        fill="url(#mvtPrimaryGrad)" 
        filter="url(#mvtSubtleGlow)"/>

  <!-- Stylized Lower 'V' Structure -->
  <path d="M 235 385 L 285 470 L 415 220 L 375 220 L 285 410 L 255 355 Z" 
        fill="url(#mvtDeepGrad)" 
        filter="url(#mvtSubtleGlow)"/>

  <!-- Ascending Monotonic Vector Arrow (Swooshing Upward) -->
  <path d="M 85 425 Q 230 350 380 145" 
        stroke="url(#mvtArrowGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        fill="none"
        filter="url(#mvtGlow)" />

  <!-- Vector Arrowhead at Top Right -->
  <polygon points="360,110 460,75 425,175 395,140" 
           fill="url(#mvtArrowGrad)" 
           filter="url(#mvtGlow)"/>
</svg>
